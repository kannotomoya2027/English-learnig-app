  /* ===== 苦手一本化 ===== */
  weakAll() {
    const list = [];
    const d = Store.d;
    (d.wrong || []).forEach(q => {
      const src = DATA.quiz.find(x => x.q === q);
      if (src) list.push({ type: 'quiz', id: q, label: q, src });
    });
    (this.gramWeakKeys() || []).forEach(key => {
      const [gi, qi] = key.split(':').map(Number);
      const g = GRAM[gi], q = g && g.q[qi];
      if (q) list.push({ type: 'gram', id: key, label: (g.t || '文法') + '：' + q.q, gi, qi, g, q });
    });
    (d.cw || []).forEach(k => {
      const cards = this.cardList('all');
      const c = cards.find(x => x.k === k);
      if (c) list.push({ type: 'card', id: k, label: c.w + ' → ' + c.ja, card: c });
    });
    (d.dw || []).forEach(en => {
      const src = (DATA.listen || []).find(x => x.en === en) || { en, ja: '' };
      list.push({ type: 'dict', id: en, label: en, src });
    });
    return list;
  }
  weakCount() { return this.weakAll().length; }
  weakByType() {
    const a = this.weakAll(), o = { quiz: 0, gram: 0, card: 0, dict: 0 };
    a.forEach(x => { if (o[x.type] != null) o[x.type]++; });
    return o;
  }
  startWeak(filter) {
    let all = this.weakAll();
    if (filter && filter !== 'all') all = all.filter(x => x.type === filter);
    if (!all.length) return toast(filter && filter !== 'all' ? 'この分野の苦手は今はありません' : '苦手は今はありません。学習を進めると、まちがえた問題がここに集まります。');
    const items = shuffle(all).slice(0, 10).map(x => {
      if (x.type === 'quiz') {
        const q = x.src;
        return { type: 'quiz', id: x.id, src: q, q: q.q, opts: shuffle(q.o.map((t, i) => ({ t, ok: i === q.a }))), sel: null };
      }
      if (x.type === 'gram') {
        const q = x.q;
        return { type: 'gram', id: x.id, gi: x.gi, qi: x.qi, g: x.g, q: q.q, opts: shuffle(q.o.map((t, i) => ({ t, ok: i === q.a }))), exp: q.e || '', sel: null };
      }
      if (x.type === 'card') {
        const c = x.card;
        const others = shuffle(this.cardList('all').filter(o => o.k !== c.k && o.ja !== c.ja)).slice(0, 3);
        return { type: 'card', id: x.id, card: c, w: c.w, opts: shuffle([{ t: c.ja, ok: true }].concat(others.map(o => ({ t: o.ja, ok: false })))), sel: null };
      }
      if (x.type === 'dict') {
        return { type: 'dict', id: x.id, en: x.src.en, ja: x.src.ja || '', sel: null, pct: null };
      }
      return null;
    }).filter(Boolean);
    this.wk = { m: 'run', items, i: 0, score: 0, done: false };
    return this.go('weak');
  }
  openWeakHub() { this.wk = { m: 'hub' }; return this.go('weak'); }
  weakView() {
    if (!this.wk) this.wk = { m: 'hub' };
    return this.wk.m === 'run' ? this.weakRunView() : this.weakHubView();
  }
  weakHubView() {
    const by = this.weakByType(), total = this.weakCount();
    const row = (type, ico, name, n, color) => n ? `<button class="tile" style="--c:${color}" data-a="weakStart" data-v="${type}"><span class="ico">${ico}</span><span class="tx"><b>${name}</b><small>${n} 問の苦手</small></span><span class="chev">›</span></button>` : '';
    const empty = total === 0
      ? this.emptyState('🌱', '苦手は今ありません', 'クイズ・文法・カード・聞き取りでまちがえると、ここに自動で集まります。できなかった問題を、あとからまとめてやり直せます。',
          '<button class="btn pri" data-a="open" data-v="quiz">🧩 クイズへ</button><button class="btn" data-a="open" data-v="gram">📚 英文法教室</button>')
      : '';
    const coach = total ? this.weakCoachLine(total, by) : '';
    return `<section class="fade col" style="max-width:none">${this.head('苦手補修')}
      <div class="center"><span class="badge">Review</span><h2>🩹 苦手補修</h2>
      <p class="mute">クイズ・文法・カード・聞き取りのまちがいを、ここにまとめています</p></div>
      ${coach ? `<div class="coach">${esc(coach)}</div>` : ''}
      ${total ? `<div class="card" style="gap:10px;background:linear-gradient(135deg,#fff1f2,#fef3c7);border-color:#fecdd3">
        <div class="hd"><b>まとめてやり直す</b><span class="mute">全 ${total} 問</span></div>
        <p style="margin:0;font-size:14px;color:#9f1239">最大10問をランダムに出します。正解すると苦手リストから外れます。</p>
        <button class="btn pri" data-a="weakStart" data-v="all">🩹 まとめて補修を始める</button>
      </div>
      <div class="grid2">
        ${row('quiz','🧩','クイズの苦手',by.quiz,'#f59e0b')}
        ${row('gram','📚','文法の苦手',by.gram,'#8b5cf6')}
        ${row('card','🗂️','カードの苦手',by.card,'#0ea5e9')}
        ${row('dict','🎧','聞き取りの苦手',by.dict,'#0d9488')}
      </div>` : empty}
    </section>`;
  }
  weakCoachLine(total, by) {
    const parts = [];
    if (by.quiz) parts.push('クイズ ' + by.quiz);
    if (by.gram) parts.push('文法 ' + by.gram);
    if (by.card) parts.push('カード ' + by.card);
    if (by.dict) parts.push('聞き取り ' + by.dict);
    return 'いま苦手は ' + total + ' 問（' + parts.join('・') + '）あります。放置せず、少しずつ潰していきましょう。前にできなかった問題でも、やり直すと定着します。';
  }
  weakRunView() {
    const W = this.wk;
    if (!W || !W.items || !W.items.length) return this.weakHubView();
    if (W.done) {
      const n = W.items.length;
      return `<section class="fade col">${this.head('苦手補修 結果')}
        ${this.resultCard(W.score, n, '苦手をしっかり減らせました', '残りはまた「苦手補修」からどうぞ',
          '<button class="btn pri" data-a="weakStart" data-v="all">🔁 もう一度</button><button class="btn" data-a="weakHub">🩹 一覧へ</button><button class="btn" data-a="home">ホームへ</button>')}
        <p class="mute center">いま残っている苦手：${this.weakCount()} 問</p>
      </section>`;
    }
    const it = W.items[W.i], ans = it.sel !== null && it.sel !== undefined;
    const typeLab = { quiz: '🧩 クイズ', gram: '📚 文法', card: '🗂️ カード', dict: '🎧 聞き取り' };
    let body = '';
    if (it.type === 'dict') {
      body = `<p class="mute">音声を聴いて、書き取ってください</p>
        <div class="row"><button class="btn pri" data-a="say" data-v="${esc(it.en)}">🔊 音声を聴く</button></div>
        <textarea id="weakDict" rows="2" maxlength="300" placeholder="聴こえた英文"></textarea>
        <div class="row"><button class="btn pri" data-a="weakDictCheck">✅ 答え合わせ</button></div>
        ${it.pct != null ? `<div class="fb fade"><b class="${it.pct >= 80 ? 'ok' : 'ng'}">${it.pct >= 80 ? '🎉 よく聴けています' : 'もう一度ゆっくり聴いてみましょう（' + it.pct + '%）'}</b>
          <p class="en" style="font-size:16px">${esc(it.en)}</p>${it.ja ? '<p class="mute">' + esc(it.ja) + '</p>' : ''}
          <button class="btn pri" data-a="weakNext">${W.i < W.items.length - 1 ? '次へ ➔' : '結果を見る ➔'}</button></div>` : ''}`;
    } else {
      const qtext = it.type === 'card' ? it.w : it.q;
      const L = 'ABCD';
      body = `<p class="mute center">${it.type === 'card' ? '次の語の意味を選んでください' : '正しいものを選んでください'}</p>
        <p class="en" style="font-size:20px;text-align:center">${this.sentence ? this.sentence(qtext) : esc(qtext)}</p>
        ${it.type === 'card' ? (typeof pronBlock === 'function' ? pronBlock(it.w.replace(/~/g, '')) : '') : ''}
        <div class="opts">${it.opts.map((o, i) => {
          let c = '';
          if (ans) c = o.ok ? 'ok' : (i === it.sel ? 'ng' : 'dim');
          return `<button class="opt ${c}" data-a="weakPick" data-v="${i}" ${ans ? 'disabled' : ''}><span>${L[i]}. ${esc(o.t)}</span><span>${ans && o.ok ? '✔' : ''}</span></button>`;
        }).join('')}</div>
        ${ans ? `<div class="fb fade"><b class="${it.opts[it.sel].ok ? 'ok' : 'ng'}">${it.opts[it.sel].ok ? '🎉 正解です！苦手リストから外します' : '❌ 正解は「' + esc(it.opts.find(o => o.ok).t) + '」'}</b>
          ${it.exp ? '<p>' + esc(it.exp) + '</p>' : ''}
          ${it.type === 'card' && it.card ? '<p>例文：' + esc(it.card.ex || '') + '</p>' : ''}
          <div class="row"><button class="btn pri" data-a="weakNext">${W.i < W.items.length - 1 ? '次へ ➔' : '結果を見る ➔'}</button></div></div>` : ''}`;
    }
    return `<section class="fade col">${this.head('苦手補修 ' + (W.i + 1) + ' / ' + W.items.length)}
      <div class="prog"><i style="width:${(W.i + (ans || it.pct != null ? 1 : 0)) / W.items.length * 100}%"></i></div>
      <div class="card"><div class="sub">${typeLab[it.type] || ''}</div>${body}</div></section>`;
  }
  weakPick(i) {
    const W = this.wk; if (!W || W.done || !W.items[W.i]) return;
    const it = W.items[W.i]; if (it.sel !== null && it.sel !== undefined) return;
    if (it.type === 'dict') return;
    i = +i; if (!it.opts || !it.opts[i]) return;
    it.sel = i;
    const ok = !!it.opts[i].ok;
    if (ok) { W.score++; this.clearWeakItem(it); }
    this.logEvent('weak', { type: it.type, id: it.id, correct: ok });
    this.sfx(ok); this.bump(); Store.touch(); this.render();
  }
  weakDictCheck() {
    const W = this.wk; if (!W || !W.items[W.i] || W.items[W.i].type !== 'dict') return;
    const it = W.items[W.i];
    const box = $('#weakDict'), raw = box ? box.value.trim() : '';
    if (!raw) return toast('英文を入力してください');
    const r = compareEN(it.en, raw);
    it.pct = r.pct; it.sel = r.pct >= 80 ? 1 : 0;
    if (r.pct >= 80) { W.score++; this.clearWeakItem(it); }
    this.logEvent('weak', { type: 'dict', id: it.id, correct: r.pct >= 80, pct: r.pct });
    this.sfx(r.pct >= 80); this.bump(); Store.touch(); this.render();
  }
  clearWeakItem(it) {
    const d = Store.d;
    if (it.type === 'quiz') {
      const x = (d.wrong || []).indexOf(it.id); if (x >= 0) d.wrong.splice(x, 1);
    } else if (it.type === 'gram') {
      if (!d.gs) d.gs = {}; d.gs[it.id] = 1;
    } else if (it.type === 'card') {
      const x = (d.cw || []).indexOf(it.id); if (x >= 0) d.cw.splice(x, 1);
    } else if (it.type === 'dict') {
      const x = (d.dw || []).indexOf(it.id); if (x >= 0) d.dw.splice(x, 1);
    }
    Store.save();
  }
  weakNext() {
    const W = this.wk; if (!W) return;
    const it = W.items[W.i];
    if (it && it.sel === null && it.pct == null) return;
    if (W.i < W.items.length - 1) { W.i++; } else { W.done = true; }
    this.render(); window.scrollTo(0, 0);
  }

  startWrongQuiz() {
    const src = shuffle(DATA.quiz.filter(x => Store.d.wrong.includes(x.q))).slice(0, 10);
    if (!src.length) return toast('間違えたクイズはまだありません。クイズで間違えた問題が、ここに自動で貯まります。');
    this.qz = { items: src.map(q => ({ src: q, q: q.q, e: q.e, opts: shuffle(q.o.map((t, i) => ({ t, ok: i === q.a }))) })), i: 0, sel: null, score: 0, wrong: [], done: false, t0: Date.now() };
    return this.go('quiz');
  }
  quizNext() {
    const Z = this.qz; if (Z.sel === null) return;
    if (Z.i < Z.items.length - 1) { Z.i++; Z.sel = null; } else {
      Z.done = true; Z.t1 = Date.now(); if (Z.place) this.placeSave(); const pct = Math.round(Z.score / Z.items.length * 100);
      if (pct > Store.d.best) { Store.d.best = pct; Store.save(); }
    }
    this.render(); window.scrollTo(0, 0);
    try { const nx = Z.items[Z.i]; if (!Z.done && Z.place && nx && nx.src && nx.src.s) setTimeout(() => Speech.say(nx.src.s, Store.d.rate || 1), 350); } catch (e) {}
  }

  /* --- 聞き取り（ディクテーション） --- */

  startDict() {
    this.lt = { mode: 'dict' };
    this.dt = { items: shuffle(DATA.listen).slice(0, 10), i: 0 };
  }
  startListenChoice(kind) {
    /* kind: 'en' = 聞こえた英文を選ぶ / 'ja' = 意味を選ぶ */
    const pool = shuffle(DATA.listen).slice(0, 10);
    const items = pool.map(it => {
      const others = shuffle(DATA.listen.filter(x => x.en !== it.en)).slice(0, 3);
      if (kind === 'ja') {
        const opts = shuffle([{ t: it.ja, ok: true }].concat(others.map(o => ({ t: o.ja, ok: false }))));
        return { src: it, opts, sel: null };
      }
      const opts = shuffle([{ t: it.en, ok: true }].concat(others.map(o => ({ t: o.en, ok: false }))));
      return { src: it, opts, sel: null };
    });
    this.lt = { mode: kind === 'ja' ? 'meaning' : 'choice', items, i: 0, score: 0, done: false };
    this.dt = null;
  }
  listenView() {
    const mode = (this.lt && this.lt.mode) || 'hub';
    if (mode === 'hub') return this.listenHubView();

    /* dict */
    if (!this.dt || !this.dt.items || !this.dt.items.length) this.startDict();
    const D = this.dt, it = D.items[D.i];

    return `<section class="fade col">${this.head('リスニング ' + (D.i + 1) + ' / ' + D.items.length)}
      ${tabs}
      <div class="prog"><i style="width:${(D.i + 1) / D.items.length * 100}%"></i></div>
      <div class="card"><div class="sub">✍️ ディクテーション（聴いて書き取る）</div>${scene(it.en, 'listen')}
        <p class="mute">音声を聴き、聴こえた英文を入力してください。🔊で速さ（ゆっくり／普通／速い）を選べます。</p>
        <div class="row"><button class="btn pri" data-a="say" data-v="${esc(it.en)}">🔊 音声を聴く</button><button class="btn" data-a="dictHint">👀 ヒント</button></div>
        <textarea id="dictText" rows="3" maxlength="300" placeholder="聴こえた英文を入力（${words}語くらい）"></textarea>
        <div class="row"><button class="btn" data-a="dictMic">🎤 英語で話す</button><button class="btn" data-a="dictClear">🗑 クリア</button><button class="btn pri" data-a="dictCheck">✅ 答え合わせ</button></div>
        <div id="dictOut"></div>
        <div class="row"><button class="btn" data-a="prev">◀ 前へ</button><button class="btn" data-a="dictNext">別の英文へ ➔</button></div>
      </div></section>`;
  }
  listenTabs(active) {
    const t = (id, label) => `<button class="${active === id ? 'on' : ''}" data-a="listenMode" data-v="${id}">${label}</button>`;
    return `<div class="tabs">${t('hub', '🏠 概要')}${t('dict', '✍️ 書き取り')}${t('choice', '🎧 英文4択')}${t('meaning', '💬 意味4択')}</div>`;
  }
  listenHubView() {

      ${weak ? `<div class="coach">聞き取りで苦手が ${weak} 文あります。書き取りや4択で復習できます。</div>` : ''}
      <div class="grid2">
        <button class="tile" style="--c:#0d9488" data-a="listenMode" data-v="dict"><span class="ico">✍️</span><span class="tx"><b>ディクテーション</b><small>聴いて英文を書き取る（王道の聞き取り）</small></span><span class="chev">›</span></button>
        <button class="tile" style="--c:#0891b2" data-a="listenMode" data-v="choice"><span class="ico">🎧</span><span class="tx"><b>英文4択</b><small>聴こえた英文を4つから選ぶ（入力不要）</small></span><span class="chev">›</span></button>
        <button class="tile" style="--c:#0284c7" data-a="listenMode" data-v="meaning"><span class="ico">💬</span><span class="tx"><b>意味4択</b><small>聴いた内容の和訳を選ぶ</small></span><span class="chev">›</span></button>
        <button class="tile" style="--c:#6366f1" data-a="open" data-v="weak"><span class="ico">🩹</span><span class="tx"><b>苦手補修へ</b><small>聞き取りの苦手 ${weak} 文をまとめて</small></span><span class="chev">›</span></button>
      </div>
      <div class="card"><div class="sub">ヒント</div>
        <p class="mute" style="margin:0">最初は「ゆっくり」再生がおすすめです。上部の速さボタン、または🔊から変更できます。英語の読み上げ中はBGMが自動で小さくなります。</p>
      </div>
    </section>`;
  }
  listenChoiceView() {
    const L = this.lt;
    if (!L || !L.items || !L.items.length) { this.startListenChoice(L && L.mode === 'meaning' ? 'ja' : 'en'); return this.listenChoiceView(); }
    if (L.done) {
      const n = L.items.length;
      return `<section class="fade col">${this.head('リスニング 結果')}
        ${this.listenTabs(L.mode)}
        ${this.resultCard(L.score, n, 'よく聴き取れています', 'もう一度、ゆっくり再生から挑戦してみましょう',
          '<button class="btn pri" data-a="listenMode" data-v="' + L.mode + '">🔁 もう一度</button><button class="btn" data-a="listenMode" data-v="hub">🏠 概要へ</button><button class="btn" data-a="home">ホーム</button>')}
      </section>`;
    }
    const it = L.items[L.i], ans = it.sel !== null;

    return `<section class="fade col">${this.head('リスニング ' + (L.i + 1) + ' / ' + L.items.length)}
      ${this.listenTabs(L.mode)}
      <div class="prog"><i style="width:${(L.i + (ans ? 1 : 0)) / L.items.length * 100}%"></i></div>
      <div class="card"><div class="sub">🎧 ${title}</div>${scene(it.src.en, 'listen')}
        <p class="mute">先に音声を聴いてから、選択肢を選んでください。</p>
        <div class="row"><button class="btn pri" data-a="say" data-v="${esc(it.src.en)}">🔊 音声を聴く</button></div>
        <div class="opts">${it.opts.map((o, i) => {
          let c = '';
          if (ans) c = o.ok ? 'ok' : (i === it.sel ? 'ng' : 'dim');
          return `<button class="opt ${c}" data-a="listenPick" data-v="${i}" ${ans ? 'disabled' : ''}><span>${letters[i]}. ${esc(o.t)}</span><span>${ans && o.ok ? '✔' : ''}</span></button>`;
        }).join('')}</div>
        ${ans ? `<div class="fb fade"><b class="${it.opts[it.sel].ok ? 'ok' : 'ng'}">${it.opts[it.sel].ok ? '🎉 正解です！' : '❌ 正解は「' + esc(it.opts.find(o => o.ok).t) + '」'}</b>
          <p class="en" style="font-size:16px">${esc(it.src.en)}</p>
          <p class="mute">${esc(it.src.ja || '')}</p>
          <div class="row"><button class="btn" data-a="say" data-v="${esc(it.src.en)}">🔊 もう一度聴く</button>
          <button class="btn pri" data-a="listenNext">${L.i < L.items.length - 1 ? '次へ ➔' : '結果を見る ➔'}</button></div></div>` : ''}
      </div></section>`;
  }
  listenPick(i) {
    const L = this.lt; if (!L || L.done || !L.items[L.i] || L.items[L.i].sel !== null) return;
    const it = L.items[L.i]; i = +i; if (!it.opts[i]) return;
    it.sel = i;
    const ok = !!it.opts[i].ok;
    if (ok) L.score++;
    this.logEvent('dict', { en: it.src.en, correct: ok, mode: L.mode });
    if (!Array.isArray(Store.d.dw)) Store.d.dw = [];
    const dx = Store.d.dw.indexOf(it.src.en);
    if (ok) { if (dx >= 0) Store.d.dw.splice(dx, 1); }
    else if (dx < 0) Store.d.dw.push(it.src.en);
    Store.save(); this.bump(); this.sfx(ok); Store.touch(); this.render();
  }
  listenNext() {
    const L = this.lt; if (!L || L.items[L.i].sel === null) return;
    if (L.i < L.items.length - 1) {
      L.i++;
      this.render();
      window.scrollTo(0, 0);
      try { setTimeout(() => Speech.say(L.items[L.i].src.en, Store.d.rate || 1), 350); } catch (e) {}
    } else { L.done = true; this.render(); window.scrollTo(0, 0); }
  }
  listenSetMode(v) {
    if (v === 'hub') { this.lt = { mode: 'hub' }; this.dt = null; return this.render(); }
    if (v === 'dict') { this.startDict(); return this.render(); }
    if (v === 'choice') { this.startListenChoice('en'); this.render(); this._listenAuto(); return; }
    if (v === 'meaning') { this.startListenChoice('ja'); this.render(); this._listenAuto(); return; }
  }
  _listenAuto() {
    try {
      const L = this.lt;
      if (!L || !L.items || !L.items[L.i]) return;
      setTimeout(() => { try { Speech.say(L.items[L.i].src.en, Store.d.rate || 1); } catch (e) {} }, 400);
    } catch (e) {}
  }
  dictCheck() {
    const D = this.dt; if (!D) return;
    const box = $('#dictText'), raw = box ? box.value.trim() : '', out = $('#dictOut');
    if (!raw) return toast('聴こえた英文を入力してください');
    if (/[\u3040-\u30ff\u3400-\u9fff]/.test(raw)) return toast('英語で入力してください（日本語が含まれています）');
    const want = D.items[D.i].en, r = compareEN(want, raw);
    this.logEvent('dict', { en: want, pct: r.pct, correct: r.pct >= 80 });
    if (!Array.isArray(Store.d.dw)) Store.d.dw = [];
    const dx = Store.d.dw.indexOf(want);
    if (r.pct >= 80) { if (dx >= 0) Store.d.dw.splice(dx, 1); }
    else if (r.pct < 60 && dx < 0) Store.d.dw.push(want);
    Store.save();
    if (r.pct >= 60) { this.bump(); Store.touch(); }
    out.innerHTML = `<div class="res fade"><span class="lab">結果：正しく書けた語 ${r.pct}%</span>
      <p class="en" style="font-size:18px">${r.html}</p>${pronBlock(want)}
      <p style="margin:0;font-size:13px;color:#475569">${r.pct >= 90 ? '🎉 ほぼ完璧です！' : r.pct >= 60 ? '👍 よく聴き取れています。赤い語を確認しましょう。' : '💪 まずは「ゆっくり」再生とヒントで、語の切れ目をつかみましょう。'}</p>
      <p class="mute" style="margin:0">和訳：${esc(D.items[D.i].ja)}</p>
      <div class="row"><button class="btn" data-a="say" data-v="${esc(want)}">🔊 もう一度聴く</button><button class="btn pri" data-a="dictNext">次の英文へ ➔</button></div></div>`;
  }
  dictNext() {
    const D = this.dt; if (!D) return;
    D.i = (D.i + 1) % D.items.length; this.render(); window.scrollTo(0, 0);
  }
  dictHint() {
    const D = this.dt; if (!D) return;
    const w = D.items[D.i].en.split(/\s+/);
    toast('最初の語は「' + w[0] + '」／全 ' + w.length + ' 語／和訳：' + D.items[D.i].ja);
  }

  /* --- 単語・熟語カードの意味テスト --- */
  startCardTest() {
    const src = shuffle(this.cardList('all')).slice(0, 10);
    this.ct = { i: 0, score: 0, items: src, sel: null, done: !src.length };
  }
  cardTestView(tabs) {
    const C = this.ct;
    if (!C || !C.items.length) return `<section class="fade col">${this.head('単語・熟語カード')}<div class="card center">${tabs}<p class="mute">出題できるカードがありません。</p></div></section>`;
    if (C.done) {
      const n = C.items.length, pct = Math.round(C.score / n * 100);
      return `<section class="fade col">${this.head('意味テスト 結果')}<div class="card center">${tabs}<div style="font-size:48px">${pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪'}</div><h2>${C.score} / ${n}</h2>
        <p class="mute">正答率 ${pct}%　${pct >= 80 ? 'よく覚えています！' : 'カードで確認してから、もう一度どうぞ。'}</p>
        <div class="row"><button class="btn pri" data-a="ctAgain">🔁 もう一度</button><button class="btn" data-a="cTab" data-v="all">🗂 カードに戻る</button><button class="btn" data-a="home">ホームへ</button></div></div></section>`;
    }
    const it = C.items[C.i];
    if (!it.opts) {
      const others = shuffle(this.cardList('all').filter(c => c.k !== it.k && c.ja !== it.ja)).slice(0, 3);
      it.opts = shuffle([{ t: it.ja, ok: true }].concat(others.map(o => ({ t: o.ja, ok: false }))));
    }
    const ans = C.sel !== null, L = 'ABCD';
    return `<section class="fade col">${this.head('意味テスト ' + (C.i + 1) + ' / ' + C.items.length)}
      <div class="prog"><i style="width:${(C.i + (ans ? 1 : 0)) / C.items.length * 100}%"></i></div>
      <div class="card">${tabs}<p class="mute center">次の語の意味を選んでください</p>
        <p class="en" style="font-size:26px;text-align:center">${this.sentence(it.w)}</p>${pronBlock(it.w)}
        <div class="opts">${it.opts.map((o, i) => { let c = ''; if (ans) c = o.ok ? 'ok' : (i === C.sel ? 'ng' : 'dim'); return `<button class="opt ${c}" data-a="ctPick" data-v="${i}" ${ans ? 'disabled' : ''}><span>${L[i]}. ${esc(o.t)}</span><span>${ans && o.ok ? '✔' : ''}</span></button>`; }).join('')}</div>
        ${ans ? `<div class="fb fade"><b class="${it.opts[C.sel].ok ? 'ok' : 'ng'}">${it.opts[C.sel].ok ? '🎉 正解です！' : '❌ 惜しい！正解は「' + esc(it.opts.find(o => o.ok).t) + '」'}</b><p>例文：${esc(it.ex)}</p><p>${esc(it.exja)}</p></div>
        <div class="row"><button class="btn" data-a="say" data-v="${esc(it.w.replace(/~/g, ''))}">🔊 発音を聴く</button><button class="btn pri" data-a="ctNext">${C.i < C.items.length - 1 ? '次の問題へ ➔' : '結果を見る ➔'}</button></div>` : ''}
      </div></section>`;
  }
  ctPick(i) {
    const C = this.ct; if (!C || C.done || C.sel !== null) return;
    const it = C.items[C.i]; if (!it.opts || !it.opts[i]) return;
    C.sel = i; this.logEvent('cardtest', { k: it.k, correct: !!it.opts[i].ok });
    if (!Array.isArray(Store.d.cw)) Store.d.cw = [];
    const cx = Store.d.cw.indexOf(it.k);
    if (it.opts[i].ok) {
      C.score++;
      if (!Store.d.ck.includes(it.k)) Store.d.ck.push(it.k);
      if (cx >= 0) Store.d.cw.splice(cx, 1);
    } else if (cx < 0) Store.d.cw.push(it.k);
    Store.save(); this.bump(); this.sfx(!!it.opts[i].ok); this.render();
  }
  ctNext() {
    const C = this.ct; if (!C || C.sel === null) return;
    if (C.i < C.items.length - 1) { C.i++; C.sel = null; } else { C.done = true; Store.touch(); }
    this.render(); window.scrollTo(0, 0);
  }
  /* --- 学習量の記録と設定 --- */
  bump(v) {
    const d = Store.d; if (!d.daily || typeof d.daily !== 'object' || Array.isArray(d.daily)) d.daily = {};
    const k = dayKey(new Date());
    d.daily[k] = (d.daily[k] || 0) + (v || 1);
    const ks = Object.keys(d.daily);
    if (ks.length > 400) ks.slice(0, ks.length - 400).forEach(x => { delete d.daily[x]; });
    Store.save();
  }
  dailyHTML() {
    const d = Store.d.daily || {}, now = new Date(), names = ['日', '月', '火', '水', '木', '金', '土'], bars = [];
    for (let k = 6; k >= 0; k--) { const t = new Date(now.getTime() - k * 864e5), key = dayKey(t); bars.push({ l: names[t.getDay()], n: d[key] || 0 }); }
    const max = Math.max(10, bars[0].n, bars[1].n, bars[2].n, bars[3].n, bars[4].n, bars[5].n, bars[6].n);
    return `<div class="card" style="gap:8px"><div class="hd"><b>📈 この7日の学習量</b><span class="mute">今日 ${bars[6].n} 回</span></div>
      <div style="display:flex;gap:6px;align-items:flex-end;height:86px">${bars.map(b => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%"><div style="width:100%;background:linear-gradient(180deg,#6366f1,#8b5cf6);border-radius:6px;height:${Math.max(4, Math.round(b.n / max * 62))}px"></div><small class="mute" style="font-size:10px">${b.l}${b.n ? ' ' + b.n : ''}</small></div>`).join('')}</div>
      <p class="mute" style="margin:0">例文を1つ進める・クイズに答える・カードを覚えるたびに1回と数えます。</p></div>`;
  }
  settingsHTML() {
    const vs = (Speech.voices || []).filter(v => /^en/i.test(v.lang));
    const sel = vs.length ? `<select id="voiceSel" class="btn" style="width:100%;text-align:left;padding:10px 12px">
      <option value="">おまかせ（${Speech.voice ? esc(Speech.voice.name) + ' を使用中' : '端末の英語音声から自動選択'}）</option>

      ${box('🗣️ 読み上げの声', sel + '<p class="mute" style="margin:0">女性の声を優先して自動選択します。</p>')}
      ${box('🌍 発音の国', `<div class="accrow">${Object.keys(ACC).map(k => `<button data-a="setAcc" data-v="${k}" class="${(Store.d.acc || 'us') === k ? 'on' : ''}" aria-label="${ACC[k].n}英語">${ACC[k].f}<small>${ACC[k].n}</small></button>`).join('')}</div><p class="mute" style="margin:0">英・豪・加の表記は規則による近似です。</p>`)}
      ${box('🔊 自動読み上げ', `<div class="row"><button class="btn ${Store.d.audio ? 'pri' : ''}" data-a="audio">${Store.d.audio ? 'ON' : 'OFF'}</button></div><p class="mute" style="margin:0">例文表示時などに自動で読み上げます。</p>`)}
      ${this.fontHTML()}
      <details style="margin-top:10px;border:1px solid #e2e8f0;border-radius:14px;padding:10px 12px;background:#fff">
        <summary style="cursor:pointer;font-weight:700;font-size:14px;color:#312e81">🔎 発音記号の目安（任意）</summary>
        <p class="mute" style="margin:8px 0">必要なときだけ開いてください。学習の本題ではありません。</p>
        ${typeof legendHTML === 'function' ? legendHTML() : ''}
      </details>
      <p class="mute" style="margin-top:12px">設定はこの端末に保存されます。</p>
    </details>`;
  }

          <p class="mute">言いたい英文を入力するか、🎤で英語を話してみましょう。<br>※ AIではなくルールベースのチェックです。よくあるスペルミス・短縮形・文法を自動訂正し、辞書にない語は提案のみ表示します。</p>

    const n = (DATA.build || []).length;
    return `<section class="fade col">${this.head('ライティング')}

      <p class="mute">英文を「書く」練習です。自由に書くか、語を並べて文を組み立てましょう。</p></div>

  /* --- 並べ替えビルド --- */
  startBuild() { this.bd = { o: shuffle(DATA.build.map((_, i) => i)), n: 0, score: 0, q: null, chips: [], placed: [], res: null, hint: null, fin: false }; this.loadBuild(); }
  loadBuild() {
    const B = this.bd, q = DATA.build[B.o[B.n]];

  }

    const q = B.q, p = q.p || '.';
    const sentence = B.placed.map(id => B.chips[id].w).join(' ');
    const done = B.res === 'ok' || B.res === 'show';
    const ans = q.w.join(' ') + p;
    return `<section class="fade col">${this.head('並べ替え ' + (B.n + 1) + ' / ' + B.o.length)}

        ${B.res === 'ng' ? '<p class="center" style="margin:0;color:var(--ng);font-weight:700">❌ 惜しい！語順や単語を見直してみましょう</p>' : ''}
        ${B.res === 'ok' ? `<p class="center" style="margin:0;color:var(--ok);font-weight:700">🎉 正解です！${B.hinted ? '' : '（ヒントなし）'}</p>` : ''}
        ${B.res === 'show' ? '<p class="center mute" style="margin:0">正解の英文です。声に出して読んでみましょう。</p>' : ''}
        ${done ? '' : `<div class="pool">${B.chips.map(c => B.placed.includes(c.id) ? '' : `<button class="chip ${B.hint === c.id ? 'hint' : ''}" data-a="bPick" data-v="${c.id}">${esc(c.w)}</button>`).join('')}</div>
        <div class="row"><button class="btn" data-a="bUndo" ${B.placed.length ? '' : 'disabled'}>↩ 1つ戻す</button><button class="btn" data-a="bReset" ${B.placed.length ? '' : 'disabled'}>🔄 リセット</button><button class="btn" data-a="bHint">💡 ヒント</button><button class="btn" data-a="bShow">👀 答えを見る</button></div>`}
        ${done ? `<div class="row"><button class="btn" data-a="say" data-v="${esc(ans)}">🔊 聴く</button><button class="btn pri" data-a="next">${B.n < B.o.length - 1 ? '次の問題 ➔' : '結果を見る ➔'}</button></div>` : ''}
      </div></section>`;
  }
  bPick(id) {
    const B = this.bd; if (!B || B.res === 'ok' || B.res === 'show' || B.placed.includes(id)) return;
    B.placed.push(id); B.res = null; B.hint = null;
    if (B.placed.length === B.q.w.length) {
      const s = norm(B.placed.map(i => B.chips[i].w).join(' ')), okList = [B.q.w.join(' '), ...(B.q.alt || [])].map(norm);
      this.logEvent('build', { q: B.q.w.join(' '), correct: okList.includes(s), hinted: !!B.hinted });
      if (okList.includes(s)) { B.res = 'ok'; this.sfx(true); if (!B.hinted && !B.wrongTry) B.score++; Store.touch(); this.bump(); this.render(); this.auto(B.placed.map(i => B.chips[i].w).join(' ') + (B.q.p || '.')); return; }
      B.res = 'ng'; B.wrongTry = true; this.sfx(false);
    }
    this.render();
  }
  bHint() {
    const B = this.bd, okList = [B.q.w, ...(B.q.alt || []).map(a => a.split(' '))];
    const cur = B.placed.map(i => B.chips[i].w.toLowerCase());
    const match = okList.find(w => cur.every((x, k) => w[k] && w[k].toLowerCase() === x));
    if (!match || cur.length >= match.length) { toast('いったんリセットしてやり直しましょう'); return; }
    const c = B.chips.find(c => !B.placed.includes(c.id) && c.w.toLowerCase() === match[cur.length].toLowerCase());
    if (c) { B.hint = c.id; B.hinted = true; this.render(); }
  }
  bNext() {
    const B = this.bd; if (B.res !== 'ok' && B.res !== 'show') return;
    if (B.n < B.o.length - 1) { B.n++; B.hinted = false; B.wrongTry = false; this.loadBuild(); } else { B.fin = true; }
    this.render(); window.scrollTo(0, 0);
  }
}

/* ===== v26：BGM（合成音・外部ファイルなし／英語音声の妨げにならない設計） ===== */
const Bgm = {
  ac: null, mg: null, tm: null, tr: 0, bar: 0, nt: 0, vm: false, mic: false,

    { n: 'さわやか散歩', style: 'pluck', bpm: 100,

    { n: '集中フォレスト', style: 'softarp', bpm: 68,

  ],
  on() { return Store.d.bgm !== false; },
  idx() { const v = Store.d.bgmVol; return v === 1 || v === 2 ? v : 0; },
  level() { return [0.6, 1, 1.6][this.idx()]; },
  want() { return this.on() && !document.hidden && !this.vm && !this.mic; },
  f(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  start() {
    if (!this.on()) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      if (!this.ac) {
        this.ac = new C(); this.mg = this.ac.createGain(); this.mg.gain.value = 0;
        const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
        lp.connect(this.mg); this.mg.connect(this.ac.destination); this.lp = lp;
      }

  },
  tick() {

      const w = this.want();

      if (!w) { if (this.nt < a.currentTime) this.nt = a.currentTime + 0.1; return; }
      let g = 0; while (this.nt < a.currentTime + 1.2 && g++ < 6) this.sched();
    } catch (e) {}
  },
  sched() {
    const a = this.ac, T = this.TR[this.tr], beat = 60 / (T.bpm || 60), len = beat * 4, t = this.nt, ch = T.c[this.bar % T.c.length];
    const style = T.style || 'pad';
    const out = this.lp || this.mg;
    try {
      if (this.lp) {
        const filt = style === 'pluck' ? 3200 : style === 'softarp' ? 1800 : style === 'drone' ? 1400 : style === 'organ' ? 1600 : 2000;
        this.lp.frequency.setTargetAtTime(filt, t, 0.15);

    } catch (e) {}
    const tone = (freq, type, s, att, dur, peak, detune) => {

        const o = a.createOscillator(), g = a.createGain();

    };

    if (style === 'pad') {
      /* 複数デチューンの長いパッド */
      ch.forEach((m, i) => {

        tone(f, 'sine', t, 1.2, len + 0.8, 0.022, 0);
        tone(f, 'sine', t, 1.2, len + 0.8, 0.016, 8);

    /* 未設定なら ON（どれか1曲が流れる） */
    if (Store.d.bgm === undefined) { Store.d.bgm = true; }
    if (typeof Store.d.bgmTr !== 'number' || Store.d.bgmTr < 0 || Store.d.bgmTr >= this.TR.length) {
      Store.d.bgmTr = 0; /* やさしい朝 */
    }
    try { Store.save(); } catch (e) {}
    this.tr = Store.d.bgmTr | 0;
    const b = document.createElement('button'); b.id = 'bgmBtn'; b.type = 'button'; b.dataset.a = 'bgmTog'; document.body.appendChild(b); this.btn();
    const kick = () => { try { if (Bgm.on() && !Bgm.tm) Bgm.start(); else if (Bgm.on() && Bgm.ac && Bgm.ac.state === 'suspended') Bgm.ac.resume(); } catch (e) {} };
    /* 起動直後に再生を試行（ブラウザが許可する場合） */
    kick();
    setTimeout(kick, 200);
    setTimeout(kick, 800);
    /* 自動再生がブロックされた場合のフォールバック：最初の操作で開始 */
    const unlock = () => { kick(); };
    ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlock, { passive: true, capture: true }));
    document.addEventListener('visibilitychange', () => {
      try {
        if (!Bgm.ac) { if (!document.hidden) kick(); return; }
        if (document.hidden) Bgm.ac.suspend();
        else if (Bgm.on()) { Bgm.ac.resume(); kick(); }
      } catch (e) {}
    });
  }
};
(function () {
  const r = App.prototype.render; App.prototype.render = function () { const x = r.apply(this, arguments); try { Bgm.sync(this.view); } catch (e) {} return x; };
  const m = App.prototype.setMic; if (m) App.prototype.setMic = function (on) { try { Bgm.mic = !!on; } catch (e) {} return m.apply(this, arguments); };
})();

const app = new App();
app.init();
Bgm.init();
</script>
<script>
/* ===== 改変検知ガード（kannotomoya作成表示の保護を含む） =====
   仕組み：ページ内の全スクリプトの内容からハッシュを再計算し、
   作成時に埋め込んだ値と一致しなければ、一文字でも編集された正規でない
   コピーとしてアプリを使用不能にします。クレジット表示が消された場合も同様です。 */
(function(){
  function h(s){var x=5381;for(var i=0;i<s.length;i++){x=((x<<5)+x+s.charCodeAt(i))|0;}return (x>>>0).toString(16);}
  var SELF_HASH='5c96e50e';
  function tamper(){
    var g=document.getElementById('guardMsg');if(g)return;
    try{speechSynthesis.cancel();}catch(e){}
    try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
    var d=document.createElement('div');d.id='guardMsg';
    d.setAttribute('style','position:fixed;inset:0;z-index:99999;background:#fff;color:#e11d48;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:sans-serif;font-weight:700;font-size:17px;line-height:1.8');
    d.innerHTML='<div style="font-size:52px">⚠️</div><div>このファイルは改変されています</div><div style="font-size:13px;color:#64748b;font-weight:500;margin-top:10px">正規版は kannotomoya 制作のオリジナルをご利用ください。</div>';
    document.body.appendChild(d);
  }
  function checkHash(){
    try{
      var t='';
      for(var i=0;i<document.scripts.length;i++){t+=(document.scripts[i].textContent||'')+'\n';}
      var lines=t.split('\n').filter(function(l){return l.indexOf('SELF_HASH')<0;});
      if(h(lines.join('\n'))!==SELF_HASH) tamper();
    }catch(e){tamper();}
  }
  function checkCredit(){
    var ok=false;
    try{var el=document.querySelector('[data-credit="kannotomoya"]');ok=!!el&&el.textContent.indexOf('kannotomoya')>=0;}catch(e){}
    if(!ok) tamper();
  }
  window.addEventListener('DOMContentLoaded',function(){checkHash();checkCredit();});
  setTimeout(function(){checkHash();checkCredit();},1200);
  setInterval(function(){checkCredit();},3000);
  try{
    new MutationObserver(function(){checkCredit();}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  }catch(e){}
})();
</script>
